<!-- src/app/layout/public-header/public-header.component.html -->
<header class="public-header">
  <div class="brand">
    <img src="escudo.png" alt="Escudo 65 Cía" class="brand-icon">
    <span class="brand-text">SIROCE-65</span>
  </div>

  <div class="header-actions">

    <button
      mat-icon-button
      class="header-icon-btn"
      (click)="theme.toggle()"
      [matTooltip]="theme.isLight() ? 'Cambiar a modo oscuro' : 'Cambiar a modo claro'"
      [attr.aria-label]="theme.isLight() ? 'Activar modo oscuro' : 'Activar modo claro'">
      <mat-icon aria-hidden="true">{{ theme.isLight() ? 'dark_mode' : 'light_mode' }}</mat-icon>
    </button>

    <a
      mat-icon-button
      class="header-icon-btn"
      routerLink="/"
      (click)="scrollToTop()"
      matTooltip="Inicio"
      aria-label="Inicio">
      <mat-icon aria-hidden="true">home</mat-icon>
    </a>

    <a
      mat-icon-button
      class="header-icon-btn"
      [href]="facebookUrl"
      target="_blank"
      rel="noopener noreferrer"
      matTooltip="Síguenos en Facebook"
      aria-label="Síguenos en Facebook">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
        <path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.23.2 2.23.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.79 8.44-4.94 8.44-9.94Z"/>
      </svg>
    </a>

    <a
      *ngIf="showLoginButton"
      mat-icon-button
      class="header-icon-btn"
      routerLink="/login"
      matTooltip="Acceso Operativo"
      aria-label="Acceso Operativo">
      <mat-icon aria-hidden="true">login</mat-icon>
    </a>

  </div>
</header>
